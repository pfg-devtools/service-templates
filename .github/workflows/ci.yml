name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: require templates
        run: |
          test -d templates/go-service
          test -d templates/python-service
          test -d templates/terraform-module
